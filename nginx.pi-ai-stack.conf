server {
  listen 80;
  server_name _;

  location /v1/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_buffering off;
    proxy_request_buffering off;
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /metrics {
    proxy_pass http://127.0.0.1:8000;
    proxy_buffering off;
  }

  location /internal/ {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8000;
    proxy_buffering off;
    proxy_request_buffering off;
  }
}
